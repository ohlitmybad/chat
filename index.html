<body>
    <script type="text/javascript">document.body.style.visibility="hidden";</script>
    <div id="SFctr" data-org="31002" data-mfl="64c215764c0b6076026762a3">
        <div style="clear:both"></div>
    </div>
    <script type="text/javascript" src="https://cdn.membershipworks.com/mfl.js"></script>
    <div id="content">
        <h1>Welcome!</h1>
    </div>
    <script type="text/javascript">
        // Redirect once the welcome message becomes visible (successful login).
        // Driven by a MutationObserver with a slow interval as a safety net; the
        // previous version re-checked every 1ms, which pinned a CPU core.
        (function () {
            var redirected = false;
            var observer = null;
            var poll = null;

            function isLoggedIn() {
                var contentDiv = document.getElementById('content');
                return !!contentDiv &&
                    contentDiv.style.display !== 'none' &&
                    document.body.style.visibility !== 'hidden';
            }

            function check() {
                if (redirected || !isLoggedIn()) return;
                redirected = true;
                if (observer) observer.disconnect();
                clearInterval(poll);
                window.location.href = "https://datamb.football/ai/";
            }

            window.addEventListener('load', function () {
                if (redirected) return;
                check();
                if (redirected) return;

                observer = new MutationObserver(check);
                observer.observe(document.documentElement, {
                    attributes: true,
                    attributeFilter: ['style'],
                    childList: true,
                    subtree: true
                });

                poll = setInterval(check, 250);
            });
        })();
 
    document.addEventListener('DOMContentLoaded', function() {
        const storedDarkMode = localStorage.getItem("darkMode");
        
        if (storedDarkMode === "true") {
            const body = document.querySelector("body");
            body.classList.add("dark-mode");
        }
        
  
    });
    </script>
</body>
